services:
  # Backend Service
  - type: web
    name: bus-tracking-backend
    env: node
    plan: free
    buildCommand: npm install && cd backend && npm install
    startCommand: node backend/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false # Set this in Render Dashboard
      - key: JWT_SECRET
        sync: false # Set this in Render Dashboard

  # Frontend Service
  - type: web
    name: bus-tracking-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ../frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: bus-tracking-backend
          type: web
          property: host
