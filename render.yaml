services:
  # Backend Service
  - type: web
    name: bus-tracking-backend
    env: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false # User will set this in Render UI
      - key: JWT_SECRET
        sync: false # User will set this in Render UI

  # Frontend Service
  - type: static_site
    name: bus-tracking-frontend
    buildCommand: cd frontend && npm install && npm run build
    publishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: bus-tracking-backend
          type: web
          property: host
