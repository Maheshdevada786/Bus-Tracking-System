services:
  # Backend Service
  - type: web
    name: bus-tracking-backend
    env: node
    plan: free
    buildCommand: npm install && cd backend && npm install
    startCommand: node backend/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false # Set this in Render Dashboard
      - key: JWT_SECRET
        sync: false # Set this in Render Dashboard

  # Frontend Service
  - type: web
    name: bus-tracking-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        sync: false # Set this to your Backend Public URL (e.g. https://bus-tracking-backend.onrender.com)
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
